#
project.group=io.github.danbrough
project.version=0.0.2

project.description="Kotlin libssh2 library wrapper"
#klog.path=../../klog
#katty.path=../../katty
#
#Kotlin
kotlin.code.style=official
kotlin.daemon.jvmargs=-Xmx3072M
#
#Gradle
org.gradle.jvmargs=-Xmx3072M -Dfile.encoding=UTF-8 --enable-native-access=ALL-UNNAMED -Denable-native-access=ALL-UNNAMED
org.gradle.configuration-cache=true
org.gradle.caching=true



#
#JetBrains
org.jetbrains.compose.experimental.jscanvas.enabled=true
#
#Android
android.nonTransitiveRClass=true
android.useAndroidX=true
#
#kotlin.native.cacheKind.linuxX64=none
kotlin.native.ignoreDisabledTargets=true
kotlin.mpp.enableCInteropCommonization=true
##kotlin.native.cacheKind.linuxX64=none
#kotlin.native.cacheKind=static                 # Use static caches for faster rebuilds
#kotlin.native.cacheKind.iosArm64=static        # Cache for iOS devices (ARM64)
#kotlin.native.cacheKind.iosSimulatorArm64=static # Cache for iOS Simulator (Apple Silicon)
#kotlin.native.cacheKind.iosX64=static          # Cache for iOS Simulator (Intel)
#kotlin.incremental.native=true                 # Rebuild only changed native code
#kotlin.native.linkerOptions=-dead_strip        # Remove unused code from binaries
#kotlin.native.cocoapods.generate.wrapper=true  # Auto-generate CocoaPods wrapper scripts
#kotlin.native.binary.stripDebugSymbols=false   # Keep debug symbols (set true for release)
#
